<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current URL</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            word-wrap: break-word;
        }

        #url {
            padding: 10px;
            background-color: #f4f4f4;
            border: 1px solid #ccc;
            font-family: monospace;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Current URL</h1>
    <div id="url"></div>

    <button id="addOrderBtn">Add Order Item</button>

    <div id="result"></div>

    <script>
        document.getElementById('url').textContent = window.location.href;

        document.getElementById('addOrderBtn').addEventListener('click', async function () {

            const roomId = '7aa535eb-fc77-4797-929f-c7e8fa1c0045';

            const payload = {
                restaurant_id: "513",
                item_id: "53308",
                quantity: 1,
                extras: []
            };

            try {
                const response = await fetch(
                    `https://dashboard.thedigitalhotelier.com/api/${roomId}/restaurant/order/order-item`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    }
                );

                const data = await response.json();

                document.getElementById('result').textContent =
                    'Success:\n' + JSON.stringify(data, null, 2);

            } catch (error) {
                document.getElementById('result').textContent =
                    'Error:\n' + error.message;
            }
        });
    </script>
</body>
</html>
